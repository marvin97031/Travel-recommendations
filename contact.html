<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Travel Recommendations</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        nav { background-color: #333; padding: 15px; display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 10px; }
        nav a { color: white; text-decoration: none; font-size: 16px; margin: 0 10px; font-weight: bold; }
        nav a:hover { text-decoration: underline; }
        nav input { padding: 8px; border-radius: 4px; border: none; width: 200px; }
        nav button { padding: 8px 15px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; }
        .btn-search { background-color: #007BFF; color: white; }
        .btn-clear { background-color: #dc3545; color: white; }
        .container { max-width: 600px; margin: 40px auto; padding: 20px; }
        form { display: flex; flex-direction: column; gap: 15px; background: #f9f9f9; padding: 20px; border-radius: 8px; border: 1px solid #ddd; }
        input, textarea { padding: 10px; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; }
        button[type="submit"] { background-color: #28a745; color: white; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button[type="submit"]:hover { background-color: #218838; }
    </style>
</head>
<body>

    <!-- Pasek Nawigacyjny -->
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact Us</a>
        <input type="text" id="searchInput" placeholder="Search...">
        <button class="btn-search" onclick="window.location.href='index.html'">Search</button>
        <button class="btn-clear" onclick="document.getElementById('searchInput').value = ''">Clear</button>
    </nav>

    <div class="container">
        <h1>Contact Us</h1>
        <p>If you have any questions, suggestions, or need help planning your trip, please reach out to us!</p>
        <p><strong>Email:</strong> support@travelrecommendations.com</p>

        <h2>Send us a message</h2>
        <!-- Formularz kontaktowy (wymagany do Zadania 4) -->
        <form action="#" onsubmit="event.preventDefault(); alert('Thank you! Your message has been sent.'); this.reset();">
            <div>
                <label for="name">Name:</label>
                <input type="text" id="name" required>
            </div>
            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="example@email.com" required>
            </div>
            <div>
                <label for="message">Message:</label>
                <textarea id="message" rows="4" required></textarea>
            </div>
            <button type="submit">Send Message</button>
        </form>
    </div>

</body>
</html>
